version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: electrovan_postgres
    environment:
      POSTGRES_USER: electrovan_user
      POSTGRES_PASSWORD: electrovan_password
      POSTGRES_DB: electrovan_db
    ports:
      - "5432:5432"
    restart: always

  api:
    build: ./backend
    container_name: electrovan_api
    environment:
      DATABASE_URL: postgresql+psycopg2://electrovan_user:electrovan_password@db:5432/electrovan_db
    depends_on:
      - db
    restart: always

  web:
    image: nginx:alpine
    container_name: electrovan-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: always
