server {
    listen 80;
    server_name electrovanret.com www.electrovanret.com;

    root /usr/share/nginx/html;
    index index.html;

    # Portal de Administración Privado (/admin/)
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
    }

    # API Backend Proxy
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sitio Web Público
    location / {
        try_files $uri $uri/ /index.html;
    }
}
